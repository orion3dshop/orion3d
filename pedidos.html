<!DOCTYPE html>
<html lang="es" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#46474d">
  <title>Orion 3D · Mis pedidos</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/auth.js"></script>
  <style>
    .pedidos-page{padding-top:8px}
    .heading-pedidos{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
    .heading-pedidos .intro{color:var(--suave);margin-top:8px;line-height:1.6;max-width:680px}
    .count{display:inline-flex;align-items:center;gap:7px;background:var(--sup);border:1px solid var(--borde);border-radius:var(--r);padding:11px 16px;color:var(--suave);white-space:nowrap}
    .count strong{color:var(--texto);font-size:1.25rem}
    .notice{background:var(--sup);border:1px solid var(--borde);border-left:4px solid var(--rojo);border-radius:var(--r);padding:14px 16px;color:var(--texto);line-height:1.55;margin-bottom:20px}
    .orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .order{min-width:0;background:var(--sup);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra);transition:transform .2s,border-color .2s}
    .order:hover{transform:translateY(-3px);border-color:var(--rojo)}
    .order-head{padding:18px 20px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
    .order-id{color:var(--suave);font-size:.76rem;letter-spacing:.09em;margin-bottom:7px;font-weight:700}
    .order h2{font-family:var(--calv);font-size:1.18rem;line-height:1.25;color:var(--texto)}
    .status{font-size:.72rem;font-weight:700;border-radius:20px;padding:6px 10px;white-space:nowrap;background:#d9eee1;color:#185c35;border:1px solid #9bc9ab}
    .status.pending{background:#fff1d5;color:#79500b;border-color:#e6c77f}
    .status.done{background:#dce8ff;color:#234b86;border-color:#a9c3ed}
    .order-body{padding:18px 20px}
    .description{color:var(--suave);line-height:1.55;margin-bottom:17px}
    .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .metric{min-width:0;background:var(--sup2);border:1px solid var(--borde);border-radius:9px;padding:12px}
    .metric span{display:block;color:var(--suave);font-size:.76rem;margin-bottom:6px}
    .metric strong{display:block;color:var(--texto);font-size:1.02rem;overflow-wrap:anywhere}
    .progress-area{margin-top:17px}
    .progress-label{display:flex;justify-content:space-between;gap:10px;color:var(--suave);font-size:.82rem;margin-bottom:8px}
    .progress-label strong{color:var(--texto)}
    .track{height:9px;border-radius:20px;background:var(--sup3);overflow:hidden}
    .fill{height:100%;background:linear-gradient(90deg,var(--rojo-osc),var(--rojo-v));border-radius:20px}
    .payment{margin-top:16px;padding:13px 14px;background:var(--sup2);border:1px solid var(--borde);border-radius:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .payment span{display:block;color:var(--suave);font-size:.8rem}
    .payment strong{display:block;color:var(--texto);font-size:.88rem;text-align:right;overflow-wrap:anywhere}
    .gallery{margin-top:19px}
    .gallery-title{font-size:.9rem;margin-bottom:10px;color:var(--texto)}
    .images{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}
    .images a{display:block;aspect-ratio:1.35;overflow:hidden;border-radius:9px;border:1px solid var(--borde);background:var(--sup3)}
    .images img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
    .images a:hover img{transform:scale(1.05)}
    .no-images{font-size:.82rem;color:var(--suave)}
    .empty{background:var(--sup);border:1px dashed var(--borde);border-radius:var(--r);text-align:center;padding:50px 20px;color:var(--suave);grid-column:1/-1}
    .empty .symbol{font-size:2rem;margin-bottom:12px}
    .empty h2{color:var(--texto);font-family:var(--calv);font-size:1.2rem;margin-bottom:8px}
    .empty p{line-height:1.55;max-width:520px;margin:auto}
    @media(max-width:850px){.orders{grid-template-columns:1fr}}
    @media(max-width:600px){.heading-pedidos{align-items:flex-start;flex-direction:column}.count{align-self:flex-start}.order-head,.order-body{padding:15px}.metrics{gap:8px}.metric{padding:10px}.payment{align-items:flex-start;flex-direction:column}.payment>div:last-child{text-align:left!important}.payment strong{text-align:left}}
  </style>
</head>
<body data-pagina="pedidos">
  <main>
    <div class="w m">
      <section class="sec pedidos-page">
        <div class="heading-pedidos">
          <div>
            <span class="eti-r">ORION 3D · SEGUIMIENTO</span>
            <h1 class="calv" id="page-title">Mis pedidos</h1>
            <p class="intro" id="page-intro">Consulta el estado y los avances de tus proyectos.</p>
          </div>
          <div class="count"><strong id="order-count">0</strong> pedidos</div>
        </div>
        <div id="notice" class="notice" hidden></div>
        <section id="orders" class="orders" aria-live="polite"></section>
      </section>
    </div>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/saludo.js"></script>
  <script>
    /*
      ==============================================================
      PEDIDOS: AGREGA Y EDITA TUS PEDIDOS EN ESTA LISTA.
      cliente debe coincidir con el nombre que guarda Auth.usuario().
      porcentajePagado solo admite 50 o 100.
      duracionDias se cuenta desde fechaInicio.
      Las rutas de imagen pueden ser locales o URL públicas.
      ==============================================================
    */
    const PEDIDOS = [
      {
        id: "ORD-001",
        cliente: "Jhon Maldonado",
        nombre: "Ejemplo: modelo 3D personalizado",
        descripcion: "Pedido de demostración. Reemplaza estos datos por los de un pedido real.",
        costo: 50,
        duracionDias: 15,
        fechaInicio: "2026-11-19",
        metodoPago: "Nequi",
        porcentajePagado: 50,
        estado: "En proceso",
        imagenes: [
          "img/pedidos/referencia-01.jpg",
          "img/pedidos/referencia-02.jpg"
        ]
      }
    ];

    // app.js ya define el selector global $; no volver a declararlo.
    const usuario = Auth.usuario() || {nombre:"", rol:"Visitante"};
    const nombreNormalizado = value => String(value || "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .trim().replace(/\s+/g, " ").toLowerCase();

    // Founder se identifica por rol; Auth.esAdmin() valida adicionalmente la firma de Admin.
    const privilegios = Auth.esAdmin() || usuario.rol === "Founder";
    const esCliente = usuario.rol === "Cliente";
    const esVisitante = usuario.rol === "Visitante";


    function fechaLocal(iso) {
      const [y,m,d] = String(iso).split("-").map(Number);
      return new Date(y, m-1, d);
    }
    function dinero(value) {
      return new Intl.NumberFormat("es-CO", {
        style:"currency", currency:"USD", maximumFractionDigits:2
      }).format(Number(value) || 0);
    }
    function diasRestantes(fechaInicio, duracionDias) {
      const inicio = fechaLocal(fechaInicio);
      const limite = new Date(inicio);
      limite.setDate(limite.getDate() + Number(duracionDias || 0));
      const hoy = new Date();
      hoy.setHours(0,0,0,0);
      return Math.ceil((limite - hoy) / 86400000);
    }
    function crearElemento(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }
    function renderPedido(pedido) {
      const card = crearElemento("article", "order");
      const head = crearElemento("div", "order-head");
      const titleBox = crearElemento("div");
      titleBox.append(
        crearElemento("div", "order-id", pedido.id),
        crearElemento("h2", "", pedido.nombre)
      );
      const statusText = pedido.estado || "En proceso";
      const statusClass = /finalizado|entregado/i.test(statusText) ? "done" :
        /pausado|pendiente|retrasado/i.test(statusText) ? "pending" : "";
      head.append(titleBox, crearElemento("span", "status " + statusClass, statusText));
      card.append(head);

      const body = crearElemento("div", "order-body");
      if (pedido.descripcion) body.append(crearElemento("p", "description", pedido.descripcion));

      const paidPct = Number(pedido.porcentajePagado) === 100 ? 100 : 50;
      const cost = Number(pedido.costo) || 0;
      const paid = cost * paidPct / 100;
      const balance = cost - paid;
      const remaining = diasRestantes(pedido.fechaInicio, pedido.duracionDias);
      const totalDays = Math.max(1, Number(pedido.duracionDias) || 1);
      const elapsed = Math.min(totalDays, Math.max(0, totalDays - remaining));
      const timePct = Math.min(100, Math.max(0, elapsed / totalDays * 100));

      const metrics = crearElemento("div", "metrics");
      [
        ["Costo total", dinero(cost)],
        ["Duración estimada", totalDays + " días"],
        ["Tiempo restante", remaining > 0 ? remaining + " días" : remaining === 0 ? "Vence hoy" : "Plazo vencido"],
        ["Fecha de inicio", pedido.fechaInicio]
      ].forEach(([label,value]) => {
        const box = crearElemento("div", "metric");
        box.append(crearElemento("span", "", label), crearElemento("strong", "", value));
        metrics.append(box);
      });
      body.append(metrics);

      const progress = crearElemento("div", "progress-area");
      const pLabel = crearElemento("div", "progress-label");
      pLabel.append(crearElemento("span", "", "Tiempo transcurrido"), crearElemento("strong", "", Math.round(timePct) + "%"));
      const track = crearElemento("div", "track");
      const fill = crearElemento("div", "fill");
      fill.style.width = timePct + "%";
      track.append(fill);
      progress.append(pLabel, track);
      body.append(progress);

      const payment = crearElemento("div", "payment");
      const payLeft = crearElemento("div");
      payLeft.append(
        crearElemento("span", "", "Método de pago"),
        crearElemento("div", "", pedido.metodoPago || "No especificado")
      );
      const payRight = crearElemento("div");
      payRight.style.textAlign = "right";
      payRight.append(
        crearElemento("span", "", "Pagado: " + paidPct + "%"),
        crearElemento("strong", "", dinero(paid) + " · Pendiente " + dinero(balance))
      );
      payment.append(payLeft, payRight);
      body.append(payment);

      const gallery = crearElemento("div", "gallery");
      gallery.append(crearElemento("h3", "gallery-title", "Imágenes de referencia y avances"));
      const images = crearElemento("div", "images");
      (Array.isArray(pedido.imagenes) ? pedido.imagenes : []).forEach((src, index) => {
        if (!src) return;
        const link = document.createElement("a");
        link.href = src;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", "Abrir imagen " + (index + 1) + " del pedido " + pedido.id);
        const img = document.createElement("img");
        img.src = src;
        img.alt = "Referencia o avance " + (index + 1) + " de " + pedido.nombre;
        img.loading = "lazy";
        link.append(img);
        images.append(link);
      });
      if (!images.children.length) images.append(crearElemento("p", "no-images", "Todavía no hay imágenes cargadas."));
      gallery.append(images);
      body.append(gallery);
      card.append(body);
      return card;
    }

    function render() {
      const container = $("#orders");
      let visibles = [];

      if (privilegios) {
        visibles = PEDIDOS;
        $("#page-title").textContent = "Todos los pedidos";
        $("#page-intro").textContent = "Vista administrativa: puedes consultar los pedidos de todos los clientes.";
      } else if (esCliente) {
        visibles = PEDIDOS.filter(p => nombreNormalizado(p.cliente) === nombreNormalizado(usuario.nombre));
        $("#page-title").textContent = "Mis pedidos";
        $("#page-intro").textContent = "Pedidos registrados para " + usuario.nombre + ".";
      } else if (esVisitante) {
        $("#page-title").textContent = "Pedidos";
        $("#page-intro").textContent = "Inicia sesión como cliente para consultar tus pedidos.";
      } else {
        $("#page-intro").textContent = "Tu cuenta no tiene acceso a los pedidos.";
      }

      $("#order-count").textContent = visibles.length;
      if (!visibles.length) {
        const empty = crearElemento("div", "empty");
        empty.append(
          crearElemento("div", "symbol", esVisitante ? "🔒" : "📦"),
          crearElemento("h2", "", esVisitante ? "Inicia sesión como cliente" : "No hay pedidos para mostrar"),
          crearElemento("p", "", esVisitante
            ? "La sesión de visitante no permite consultar pedidos. Ingresa con tu cuenta de cliente."
            : "Cuando se registre un pedido asociado a esta cuenta, aparecerá aquí.")
        );
        container.append(empty);
        return;
      }
      visibles.forEach(p => container.append(renderPedido(p)));
    }
    render();
  </script>
</body>
</html>
